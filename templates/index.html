<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Café Terraza - Iniciar Sesión</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <style>
body {
  margin: 0;
  font-family: 'Quicksand', sans-serif;
  /* Fondo con imagen difuminada */
  background: 
    linear-gradient(to bottom right, rgba(255,255,255,0.6), rgba(245,234,224,0.8)),
    url("{{ url_for('static', filename='images/fondo_login.png') }}");
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

    .login-card {
      background: rgba(255, 255, 255, 0.92);
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      padding: 2rem 2rem; /* menos padding */
      width: 100%;
      max-width: 380px; /* un poco más angosto */
      text-align: center;
    }


    .login-card img {
      width: 130px; /* mantené el tamaño grande */
      height: auto;
      margin-bottom: 0.5rem; /* menos separación debajo */
    }



    .login-card h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      color: #5e3d28; /* marrón café */
      margin-bottom: 0.5rem;
    }

    .login-card p {
      color: #7a6e65;
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }

    .login-card input {
      width: 100%;
      padding: 12px;
      margin-bottom: 1rem;
      border: 1px solid #e4dcd4;
      border-radius: 10px;
      background-color: #fcf9f6;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.3s ease;
    }

    .login-card input:focus {
      border-color: #c8a27e;
    }

    .btn-login {
      background-color: #b88b65;
      color: white;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      padding: 12px;
      width: 100%;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .btn-login:hover {
      background-color: #a47857;
    }

    .btn-cliente {
      background: transparent;
      border: 1px solid #d7c1ad;
      color: #7b5b44;
      border-radius: 12px;
      padding: 10px;
      width: 100%;
      margin-top: 0.5rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-cliente:hover {
      background-color: #f1e3d5;
    }

    .login-card small {
      display: block;
      margin-top: 1.5rem;
      color: #9b8f85;
      font-size: 0.8rem;
    }

    footer {
      text-align: center;
      margin-top: 1rem;
      font-size: 0.75rem;
      color: #a59c93;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Café Terraza" class="logo-img">
    <h1>Iniciar Sesión</h1>
    <p>Bienvenido a Café Terraza. Ingresá con tu cuenta para continuar.</p>

    <form id="login-form">
      <input type="text" id="username" name="username" placeholder="Usuario" required>
      <input type="password" id="password" name="password" placeholder="Contraseña" required>

      <button type="submit" class="btn-login">Iniciar Sesión</button>
      <button type="button" id="cliente-login" class="btn-cliente">Entrar como Cliente</button>
    </form>

    <small>¿Olvidaste la contraseña? Contactá al administrador.</small>

    <footer>© {{ current_year if current_year is defined else '' }} Café Terraza</footer>
  </div>

  <script>
  document.addEventListener('DOMContentLoaded', () => {
    const loginForm = document.getElementById('login-form');
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const body = await res.json().catch(() => ({}));
        if (res.ok && body.success) {
          window.location.href = body.redirect || '/dashboard';
        } else {
          alert(body.message || 'Credenciales inválidas');
        }
      } catch (err) {
        console.error(err);
        alert('Error en el login.');
      }
    });

    document.getElementById('cliente-login').addEventListener('click', async () => {
      try {
        const res = await fetch('/api/login_cliente', { method: 'POST' });
        const body = await res.json().catch(() => ({}));
        if (res.ok && body.success) {
          window.location.href = body.redirect || '/dashboard_cliente';
        } else {
          alert(body.message || 'No se pudo entrar como cliente');
        }
      } catch (err) {
        console.error(err);
        alert('Error al intentar entrar como cliente');
      }
    });
  });
  </script>
</body>
</html>
